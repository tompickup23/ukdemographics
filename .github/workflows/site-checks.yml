name: Site checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        # Full history: the sitemap dates generated pages by the last commit to
        # their templates (src/pages/sitemap.xml.ts). A shallow clone has none.
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Exercise the refresh parser using the same schema checks as cron.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python packages for the spreadsheet transforms
        run: python3 -m pip install --quiet pandas==2.2.3 odfpy==1.4.1 openpyxl==3.1.5
      - name: Check DHSC workbook schemas
        run: python3 -m unittest discover -s tests -p test_asc_schema.py
      - run: npm test
      - run: npm run check
      - env:
          BUILD_OG: "1"
        run: npm run build
      - run: node scripts/check/place-map-weight.mjs
      - run: node scripts/check/national-map-weight.mjs
      - run: node scripts/check/group-map-weight.mjs
      - run: node scripts/check/published-dashes.mjs
      - run: node scripts/check/published-anonymity.mjs
      - run: node scripts/check/place-cards.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile
      - run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
