name: Site checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      # Playwright disabled — see deploy.yml note. Re-enable once specs are
      # rewritten to cover the UKD page set (places / national / regional /
      # compare / your-area / pressure / schools / housing).
