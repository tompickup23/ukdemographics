name: Site checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Full history: the sitemap dates generated pages by the last commit to
        # their templates (src/pages/sitemap.xml.ts). A shallow clone has none.
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - env:
          BUILD_OG: "1"
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile
      - run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
