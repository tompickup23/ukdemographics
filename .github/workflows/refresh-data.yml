name: Refresh data

# Manual-only until the real refresh pipeline lands (P1).
#
# The previous cron called npm scripts inherited from the asylumstats fork
# (ingest:routes / regionalsources / hotels / money). Those scripts have been
# removed - none of them produced data used by the UK Demographics pages,
# and the hotel transform died on a missing src/data/live/asylum-finance.json.
#
# Real refresh source-of-truth: the Python transforms under
# scripts/transform/transform_*.py (NINo, PIP, payroll, country-of-birth,
# crime, SEND, ASC, etc.). These currently run by hand because the raw
# downloads (~2 GB) are gitignored. Wiring them into CI is a P1 task that
# needs the fetchers to be CI-safe first.

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Placeholder
        run: echo "Refresh pipeline pending - see workflow comments."
