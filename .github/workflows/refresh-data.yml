name: Refresh data

# Weekly refresh of the public datasets that can run without API keys.
# Adds one transform at a time; the pattern is:
#   1. fetch raw data into data/raw/<dataset>/ (gitignored)
#   2. run the Python transform to produce src/data/live/<file>.json
#   3. decide whether anything substantive changed (run timestamps do not count)
#   4. run npm test on the refreshed data; a failure parks it on a branch with an
#      issue, and main keeps the last data that passed
#   5. commit to main (never deleting a data file), rebase-retry to survive cron
#      races, then dispatch deploy.yml, because this push alone deploys nothing
#
# Every ingest is secondary: a fetch or transform that fails restores that dataset's
# committed files, the other ingests carry on, and one open refresh-failed issue names
# the ingest and quotes the end of its log. The 2 November 2026 run failed that way
# (DHSC renamed a column) and opened nothing, because only a test failure opened an
# issue then. docs/REFRESH.md says what each step fetches and from where.
#
# Datasets that need DWP Stat-Xplore / Companies House / Land Registry
# API keys land separately once the secrets are wired up; docs/REFRESH.md names them.
#
# The pattern follows Asylum Stats' refresh-data.yml, which learned each of these
# steps from a failure on its own live site.

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

# contents: write for the commit and the refresh-failed branch. issues: write for the
# refresh-failed issue and the MP list issue. actions: write for the deploy dispatch
# at the end; see the comment on that step.
permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The spreadsheet transforms (births, TB and the other publisher ingests) read
      # .ods and .xlsx through pandas and openpyxl.
      - name: Python packages for the spreadsheet transforms
        run: python3 -m pip install --quiet pandas==2.2.3 odfpy==1.4.1 openpyxl==3.1.5
      - run: npm ci

      # data.police.uk stop-and-search, the newest three months, one request per
      # force-month, no key. Secondary ingest, as births below: a failure (a refused or
      # failed force-month included, so no total is published with a force missing)
      # restores the committed file, lets the rest of the refresh carry on, and turns the
      # run red at the end. Each fetch and transform below tees its output to a log in
      # RUNNER_TEMP so the ingest-failed issue can quote it; shell: bash adds pipefail,
      # so the step still fails when the script does.
      - name: Fetch stop-and-search (data.police.uk, no auth)
        id: sas_fetch
        continue-on-error: true
        shell: bash
        run: node scripts/fetch/fetch-stop-and-search.mjs 2>&1 | tee "$RUNNER_TEMP/stop-and-search-fetch.log"

      - name: Transform stop-and-search
        id: sas
        if: steps.sas_fetch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: python3 scripts/transform/transform_stop_and_search.py 2>&1 | tee "$RUNNER_TEMP/stop-and-search-transform.log"

      # The stop-and-search manifest is new on 4 November 2026, so until a run commits it
      # there is no committed copy to restore and the run's copy is removed instead.
      # Pure shell, no GitHub event data is interpolated here.
      - name: Restore the stop-and-search file if its ingest failed
        if: steps.sas_fetch.outcome == 'failure' || steps.sas.outcome == 'failure'
        run: |
          git checkout -- src/data/live/stop-and-search.json
          if git ls-files --error-unmatch data/raw/manifests/police_stops.json > /dev/null 2>&1; then
            git checkout -- data/raw/manifests/police_stops.json
          else
            rm -f data/raw/manifests/police_stops.json
          fi

      # ONS births by parents' country of birth: one edition a year (May), no key.
      # The fetch resolves the newest edition from the ONS dataset page; the transforms
      # read the year, release date and columns from the workbook, and the history
      # transform stops on a break in the series. Secondary ingest: a failure here
      # restores the committed births files, lets the rest of the refresh carry on, and
      # turns the run red at the end.
      - name: Fetch births by parents' country of birth (ONS, no auth)
        id: births_fetch
        continue-on-error: true
        shell: bash
        run: node scripts/fetch/fetch-ons-births-cob.mjs 2>&1 | tee "$RUNNER_TEMP/births-fetch.log"

      - name: Transform births by parents' country of birth
        id: births
        if: steps.births_fetch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          {
            python3 scripts/transform/transform_births_by_mother_cob.py
            python3 scripts/transform/transform_births_history.py
          } 2>&1 | tee "$RUNNER_TEMP/births-transform.log"

      # Pure shell, no GitHub event data is interpolated here.
      - name: Restore the births files if the births ingest failed
        if: steps.births_fetch.outcome == 'failure' || steps.births.outcome == 'failure'
        run: git checkout -- src/data/live/births-by-mother-cob.json src/data/live/births-history-national.json data/raw/manifests/ons_births_cob.json

      # UKHSA TB surveillance tables, found on GOV.UK by title, no key. Annual: most
      # weeks record an "unchanged" attempt in the manifest and rewrite the same file.
      # Secondary ingest, as births above: a failure restores the committed file, lets
      # the rest of the refresh carry on, and turns the run red at the end.
      - name: Fetch UKHSA TB (GOV.UK, no auth)
        id: tb_fetch
        continue-on-error: true
        shell: bash
        run: node scripts/fetch/fetch-ukhsa-tb.mjs 2>&1 | tee "$RUNNER_TEMP/tb-fetch.log"

      - name: Transform UKHSA TB
        id: tb
        if: steps.tb_fetch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: python3 scripts/transform/transform_tb.py 2>&1 | tee "$RUNNER_TEMP/tb-transform.log"

      # Pure shell, no GitHub event data is interpolated here.
      - name: Restore the TB file if the TB ingest failed
        if: steps.tb_fetch.outcome == 'failure' || steps.tb.outcome == 'failure'
        run: git checkout -- src/data/live/tb-notifications.json data/raw/manifests/ukhsa_tb.json

      # MHCLG Council Taxbase, found on GOV.UK by title, no key. Annual (November);
      # other weeks record an "unchanged" attempt and rewrite the same file.
      # Secondary ingest, as births above: a failure restores the committed file, lets
      # the rest of the refresh carry on, and turns the run red at the end.
      - name: Fetch MHCLG Council Taxbase (GOV.UK, no auth)
        id: ctb_fetch
        continue-on-error: true
        shell: bash
        run: node scripts/fetch/fetch-council-taxbase.mjs 2>&1 | tee "$RUNNER_TEMP/ctb-fetch.log"

      - name: Transform MHCLG Council Taxbase
        id: ctb
        if: steps.ctb_fetch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: python3 scripts/transform/transform_council_tax_spd.py 2>&1 | tee "$RUNNER_TEMP/ctb-transform.log"

      # Pure shell, no GitHub event data is interpolated here.
      - name: Restore the MHCLG Council Taxbase file if its ingest failed
        if: steps.ctb_fetch.outcome == 'failure' || steps.ctb.outcome == 'failure'
        run: git checkout -- src/data/live/council-tax-spd.json data/raw/manifests/council_taxbase.json

      # Every restore step in this file also restores the ingest's manifest: the tests check
      # that the manifest names the file the committed data was built from.
      # DHSC adult social care finance and activity reports on GOV.UK, no key. Each
      # series resolves its own newest edition by title, so finance moves to a new year
      # when DHSC publishes it while activity keeps its last edition until its own
      # release. Annual: most weeks rewrite the same file. Secondary ingest, as births
      # above: a failure restores the committed file and turns the run red at the end.
      - name: Fetch DHSC adult social care tables (GOV.UK, no auth)
        id: asc_fetch
        continue-on-error: true
        shell: bash
        run: node scripts/fetch/fetch-dhsc-asc.mjs 2>&1 | tee "$RUNNER_TEMP/asc-fetch.log"

      - name: Transform DHSC adult social care tables
        id: asc
        if: steps.asc_fetch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          {
            python3 -m unittest discover -s tests -p test_asc_schema.py
            python3 scripts/transform/transform_asc.py
          } 2>&1 | tee "$RUNNER_TEMP/asc-transform.log"

      # Pure shell, no GitHub event data is interpolated here.
      - name: Restore the ASC file if the ASC ingest failed
        if: steps.asc_fetch.outcome == 'failure' || steps.asc.outcome == 'failure'
        run: git checkout -- src/data/live/asc-dashboard.json data/raw/manifests/dhsc_asc_finance.json data/raw/manifests/dhsc_asc_activity.json

      # DfE SEN figures from the statistics API, no key: newest release found by the
      # publication's slug. Annual (June); other weeks rewrite the same file.
      # Secondary ingest, as births above: a failure restores the committed file, lets
      # the rest of the refresh carry on, and turns the run red at the end.
      - name: Fetch DfE SEN (statistics API, no auth)
        id: send_fetch
        continue-on-error: true
        shell: bash
        run: node scripts/fetch/fetch-dfe-sen.mjs 2>&1 | tee "$RUNNER_TEMP/send-fetch.log"

      - name: Transform DfE SEN
        id: send
        if: steps.send_fetch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: python3 scripts/transform/transform_send.py 2>&1 | tee "$RUNNER_TEMP/send-transform.log"

      # Pure shell, no GitHub event data is interpolated here.
      - name: Restore the DfE SEN file if its ingest failed
        if: steps.send_fetch.outcome == 'failure' || steps.send.outcome == 'failure'
        run: git checkout -- src/data/live/send-dashboard.json data/raw/manifests/dfe_sen.json

      # Ignore run timestamps when deciding whether anything changed.
      #
      # A transform that stamps `generatedAt` or `lastUpdated` moves that line on every
      # run whether or not a single figure did. Counting it as a change would commit
      # every Monday and bury a real data change in a stream of identical ones, so a
      # diff that is nothing but those lines commits nothing. New, untracked files
      # under src/data/live/ always count as a change.
      # Pure shell, no GitHub event data is interpolated here.
      - name: Check for data changes
        id: changes
        run: |
          substantive="$(git diff -U0 -- src/data/live/ \
            | grep -E '^[+-]' \
            | grep -Ev '^(\+\+\+|---)' \
            | grep -Ev '"(generatedAt|generated_at|lastUpdated)"' \
            || true)"
          untracked="$(git ls-files --others --exclude-standard -- src/data/live/)"
          if [ -n "$substantive" ] || [ -n "$untracked" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Substantive data changes found:"
            if [ -n "$untracked" ]; then
              echo "New files:"
              echo "$untracked"
            fi
            echo "$substantive" | head -40
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes beyond run timestamps. Nothing to commit."
          fi

      # The same unit tests the deploy runs, run here before anything reaches main.
      # Until now only deploy.yml ran them, after this job had already pushed, so
      # refreshed data that broke a test would have turned main red with nobody told.
      # Pure shell, no GitHub event data is interpolated here.
      - name: Test the refreshed data
        id: datatests
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: npm test

      - name: Park refreshed data that failed the tests
        if: steps.changes.outputs.changed == 'true' && steps.datatests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="data/refresh-failed-$(date -u +%Y-%m-%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/data/live/ data/raw/manifests/
          git commit -m "data: refresh that failed the tests $(date -u +%Y-%m-%d)"
          git push origin "$branch"
          gh label create refresh-failed --color B60205 --description "Refreshed data failed the tests" --force
          gh issue create --label refresh-failed \
            --title "Data refresh failed the tests ($(date -u +%Y-%m-%d))" \
            --body "The refreshed data failed \`npm test\` and was not committed to main. The live site keeps the last data that passed.

          Run: $RUN_URL
          Data: branch \`$branch\`

          If the failure is a test pinned to an old figure, the test is wrong: make it check shape, not values. If a figure moved, check it against the primary source before merging."

      - name: Commit and push updated data
        id: commit
        if: steps.changes.outputs.changed == 'true' && steps.datatests.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Fetch manifests (data/raw/manifests/) record each retrieval attempt. They go in
          # with the data they describe; a run that changes no data commits neither.
          git add src/data/live/ data/raw/manifests/

          # A refresh adds and updates. It does not delete. A fetch that half fails
          # leaves files unwritten, and `git add` would stage their absence as a
          # routine refresh (Asylum Stats lost 11 canonical files that way on
          # 24 August 2026). Deleting a data file belongs in a human commit.
          # Pure shell, no GitHub event data is interpolated here.
          deleted="$(git diff --cached --diff-filter=D --name-only -- src/data/live/)"
          if [ -n "$deleted" ]; then
            echo "Refusing to commit: this refresh would DELETE committed data."
            echo "$deleted"
            echo "A failed or partial ingest cannot be allowed to remove files."
            exit 1
          fi

          STAMP="$(date -u +%Y-%m-%d)"
          git commit -m "data: weekly refresh ${STAMP}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying in $((i * 5))s..."
            sleep $((i * 5))
          done
          echo "Push failed after 5 retries."
          exit 1

      # Ask for a deploy, because the push above will not produce one.
      #
      # GitHub raises no workflow events for pushes made with the default
      # GITHUB_TOKEN, which stops workflows triggering themselves forever. The side
      # effect was that every refresh commit since this workflow was restored in May
      # 2026 landed on main and never deployed on its own: the data reached the live
      # site only when an unrelated human push happened to follow. A
      # workflow_dispatch is the documented exception, and needs actions: write.
      # Pure shell, no GitHub event data is interpolated here.
      - name: Deploy the refreshed data
        if: steps.commit.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml --ref main
          echo "Dispatched deploy.yml on main." >> "$GITHUB_STEP_SUMMARY"

      # MPs change at by-elections and when the whip moves. A changed MP or
      # party is a published fact that needs a second source, so this step
      # never commits: it keeps one open issue listing what differs from
      # Parliament, and a person corroborates and runs the fetch.
      - name: Check MP list against Parliament (opens an issue, never commits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPORT="$RUNNER_TEMP/mp-diff.md"
          node scripts/fetch/fetch-mp-data.mjs --check --report "$REPORT"
          TITLE="MP list differs from Parliament"
          NUM="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number')"
          if [ -s "$REPORT" ]; then
            if [ -n "$NUM" ]; then
              gh issue edit "$NUM" --body-file "$REPORT"
            else
              gh issue create --title "$TITLE" --body-file "$REPORT"
            fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "The MP list matches Parliament again."
          fi

      # A failed ingest is the other way a run goes red, and until 4 November 2026 it
      # opened no issue: the 2 November run failed on the DHSC transform and told nobody.
      # This keeps one open issue for ingest failures, separate from the per-run issue
      # the test failure opens above. It lists each failed ingest with the end of its
      # fetch and transform logs, is rewritten on each failing run, and is closed with a
      # comment by the first run in which every fetch and transform succeeds. A run that
      # stopped before the ingests (npm ci, say) has no outcomes and leaves it alone.
      # Reads step outcomes and the run URL only; no GitHub event data is interpolated.
      - name: Open, update or close the ingest-failed issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SAS_FETCH_OUTCOME: ${{ steps.sas_fetch.outcome }}
          SAS_OUTCOME: ${{ steps.sas.outcome }}
          BIRTHS_FETCH_OUTCOME: ${{ steps.births_fetch.outcome }}
          BIRTHS_OUTCOME: ${{ steps.births.outcome }}
          TB_FETCH_OUTCOME: ${{ steps.tb_fetch.outcome }}
          TB_OUTCOME: ${{ steps.tb.outcome }}
          CTB_FETCH_OUTCOME: ${{ steps.ctb_fetch.outcome }}
          CTB_OUTCOME: ${{ steps.ctb.outcome }}
          ASC_FETCH_OUTCOME: ${{ steps.asc_fetch.outcome }}
          ASC_OUTCOME: ${{ steps.asc.outcome }}
          SEND_FETCH_OUTCOME: ${{ steps.send_fetch.outcome }}
          SEND_OUTCOME: ${{ steps.send.outcome }}
        run: |
          report="$RUNNER_TEMP/ingest-failures.md"
          : > "$report"
          passed=0
          check() {
            name="$1"; label="$2"; fetch="$3"; transform="$4"
            if [ "$fetch" = "success" ] && [ "$transform" = "success" ]; then
              passed=$((passed + 1))
              return
            fi
            if [ "$fetch" != "failure" ] && [ "$transform" != "failure" ]; then
              return
            fi
            {
              echo "### $label"
              echo
              echo "Fetch: ${fetch:-not run}. Transform: ${transform:-not run}. The committed files for this dataset were kept."
              echo
              for part in fetch transform; do
                log="$RUNNER_TEMP/$name-$part.log"
                if [ -s "$log" ]; then
                  echo "End of the $part log:"
                  echo
                  echo "~~~"
                  tail -n 15 "$log"
                  echo "~~~"
                  echo
                fi
              done
            } >> "$report"
          }
          check stop-and-search "Stop and search (data.police.uk)" "$SAS_FETCH_OUTCOME" "$SAS_OUTCOME"
          check births "Births by parents' country of birth (ONS)" "$BIRTHS_FETCH_OUTCOME" "$BIRTHS_OUTCOME"
          check tb "TB notifications (UKHSA)" "$TB_FETCH_OUTCOME" "$TB_OUTCOME"
          check ctb "Council Taxbase (MHCLG)" "$CTB_FETCH_OUTCOME" "$CTB_OUTCOME"
          check asc "Adult social care finance and activity (DHSC)" "$ASC_FETCH_OUTCOME" "$ASC_OUTCOME"
          check send "Special educational needs (DfE)" "$SEND_FETCH_OUTCOME" "$SEND_OUTCOME"

          export TITLE="Data refresh: an ingest failed"
          NUM="$(gh issue list --state open --label refresh-failed --json number,title \
            -q '.[] | select(.title == $ENV.TITLE) | .number' | head -n 1)"
          if [ -s "$report" ]; then
            body="$RUNNER_TEMP/ingest-issue.md"
            {
              echo "One or more ingests failed in the weekly data refresh. Each failed ingest's committed files were kept, so the live site shows the last data that passed, and the other ingests carried on."
              echo
              echo "Run: $RUN_URL"
              echo
              echo "Each fetch names the publisher and the URL it could not use. A moved file, a renamed sheet or column, or a new edition's layout is the script's to fix; a withdrawn file or a refusal is the publisher's. docs/REFRESH.md lists what each step fetches and from where."
              echo
              cat "$report"
            } > "$body"
            gh label create refresh-failed --color B60205 --description "Refreshed data failed the tests" --force
            if [ -n "$NUM" ]; then
              gh issue edit "$NUM" --body-file "$body"
              gh issue comment "$NUM" --body "Failed again: $RUN_URL"
            else
              gh issue create --label refresh-failed --title "$TITLE" --body-file "$body"
            fi
          elif [ -n "$NUM" ] && [ "$passed" -eq 6 ]; then
            gh issue close "$NUM" --comment "Every ingest passed in $RUN_URL."
          fi

      # Last, so the MP check and the issue step above still run on a week when an
      # ingest or the data tests fail. Those steps are continue-on-error so that the
      # data can be restored or parked; this makes sure the run still ends red.
      # Reads a step outcome only; no GitHub event data is interpolated here.
      - name: Fail if an ingest or the data tests failed
        if: always()
        env:
          DATATESTS_OUTCOME: ${{ steps.datatests.outcome }}
          SAS_FETCH_OUTCOME: ${{ steps.sas_fetch.outcome }}
          SAS_OUTCOME: ${{ steps.sas.outcome }}
          BIRTHS_FETCH_OUTCOME: ${{ steps.births_fetch.outcome }}
          BIRTHS_OUTCOME: ${{ steps.births.outcome }}
          TB_FETCH_OUTCOME: ${{ steps.tb_fetch.outcome }}
          TB_OUTCOME: ${{ steps.tb.outcome }}
          CTB_FETCH_OUTCOME: ${{ steps.ctb_fetch.outcome }}
          CTB_OUTCOME: ${{ steps.ctb.outcome }}
          ASC_FETCH_OUTCOME: ${{ steps.asc_fetch.outcome }}
          ASC_OUTCOME: ${{ steps.asc.outcome }}
          SEND_FETCH_OUTCOME: ${{ steps.send_fetch.outcome }}
          SEND_OUTCOME: ${{ steps.send.outcome }}
        run: |
          failed=0
          if [ "$DATATESTS_OUTCOME" = "failure" ]; then
            echo "The refreshed data failed npm test and was NOT committed. See the refresh-failed issue."
            failed=1
          fi
          if [ "$SAS_FETCH_OUTCOME" = "failure" ] || [ "$SAS_OUTCOME" = "failure" ]; then
            echo "Stop and search was skipped (fetch: $SAS_FETCH_OUTCOME, transform: $SAS_OUTCOME). The committed stop-and-search.json was kept."
            failed=1
          fi
          if [ "$BIRTHS_FETCH_OUTCOME" = "failure" ] || [ "$BIRTHS_OUTCOME" = "failure" ]; then
            echo "Births by parents' country of birth was skipped (fetch: $BIRTHS_FETCH_OUTCOME, transform: $BIRTHS_OUTCOME). The committed births files were kept."
            failed=1
          fi
          if [ "$TB_FETCH_OUTCOME" = "failure" ] || [ "$TB_OUTCOME" = "failure" ]; then
            echo "UKHSA TB was skipped (fetch: $TB_FETCH_OUTCOME, transform: $TB_OUTCOME). The committed tb-notifications.json was kept."
            failed=1
          fi
          if [ "$CTB_FETCH_OUTCOME" = "failure" ] || [ "$CTB_OUTCOME" = "failure" ]; then
            echo "MHCLG Council Taxbase was skipped (fetch: $CTB_FETCH_OUTCOME, transform: $CTB_OUTCOME). The committed council-tax-spd.json was kept."
            failed=1
          fi
          if [ "$ASC_FETCH_OUTCOME" = "failure" ] || [ "$ASC_OUTCOME" = "failure" ]; then
            echo "DHSC adult social care was skipped (fetch: $ASC_FETCH_OUTCOME, transform: $ASC_OUTCOME). The committed asc-dashboard.json was kept."
            failed=1
          fi
          if [ "$SEND_FETCH_OUTCOME" = "failure" ] || [ "$SEND_OUTCOME" = "failure" ]; then
            echo "DfE SEN was skipped (fetch: $SEND_FETCH_OUTCOME, transform: $SEND_OUTCOME). The committed send-dashboard.json was kept."
            failed=1
          fi
          exit "$failed"
