name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # refresh-data.yml dispatches this after committing refreshed data, because its
  # push with the default token raises no push event. Keep this trigger.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Full history: the sitemap dates generated pages by the last commit to
        # their templates (src/pages/sitemap.xml.ts). A shallow clone has none.
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - env:
          BUILD_OG: "1"
        run: npm run build
      - run: node scripts/check/place-map-weight.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile
      - run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Submit only URLs whose sitemap lastmod identifies a real same-day
      # content revision. The key file is part of the deployed artifact above.
      #
      # continue-on-error because telling a search engine about a change is an
      # optimisation and the deploy is not. On 4 October 2026 (run 37166838543)
      # Pages deployed and the site went live, then this step failed and marked
      # the whole run red, which hid whether the deploy had worked. The outcome is
      # reported in the job summary by the next step instead.
      # Pure shell, no GitHub event data is interpolated here.
      - name: Notify IndexNow of changed canonical URLs
        id: indexnow
        continue-on-error: true
        env:
          INDEXNOW_SUBMIT: "1"
        run: node scripts/indexnow-submit.mjs --sitemap
      # Reads a step outcome only; no GitHub event data is interpolated here.
      - name: Report IndexNow outcome
        if: always()
        env:
          INDEXNOW_OUTCOME: ${{ steps.indexnow.outcome }}
        run: |
          case "$INDEXNOW_OUTCOME" in
            success)
              echo "IndexNow: notified (or nothing changed today)." >> "$GITHUB_STEP_SUMMARY" ;;
            failure)
              echo "::warning title=IndexNow failed::The site deployed, but IndexNow was not notified. See the Notify IndexNow step log."
              echo "IndexNow: **failed**. Pages deployed; search engines were not notified of changed URLs. See the Notify IndexNow step log." >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "IndexNow: not run (outcome: ${INDEXNOW_OUTCOME:-none})." >> "$GITHUB_STEP_SUMMARY" ;;
          esac
